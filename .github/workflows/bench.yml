name: islo-bench
on:
  push:
    branches: [lab]
    paths: [bench/trigger]
  workflow_dispatch:
    inputs:
      mode:
        description: "bench.sh mode: full | ci-resume | opencv | py-full | py-ci-resume"
        required: true
        default: full
env:
  MODE: ${{ inputs.mode || 'full' }}
  FAMILY: ${{ startsWith(inputs.mode || 'full', 'py') && 'py' || 'cc' }}   # separate caches per workload: fmt runs must never restore a FastAPI cache
jobs:
  bench:
    runs-on: ubuntu-24.04   # 4 vCPU / 16 GB (public repo standard runner)
    steps:
      - uses: actions/checkout@v4
      - name: Restore caches (ephemeral-CI analog of resume)
        if: endsWith(env.MODE, 'ci-resume')
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.ccache-bench
            ~/.cache/uv-bench
          key: bench-${{ env.FAMILY }}-${{ github.run_id }}
          restore-keys: bench-${{ env.FAMILY }}-
      - name: bench
        run: bash bench/bench.sh "$MODE" gha
      - name: Save caches
        if: env.MODE == 'full' || env.MODE == 'py-full'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.ccache-bench
            ~/.cache/uv-bench
          key: bench-${{ env.FAMILY }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ env.MODE }}
          path: ~/bench/*.jsonl
