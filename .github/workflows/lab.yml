name: lab-build
on:
  push:
    branches: [lab]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: fmt-lab
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: time cmake --build build
      - name: Test
        run: time ctest --test-dir build --output-on-failure
      - name: ccache stats
        run: ccache -s
